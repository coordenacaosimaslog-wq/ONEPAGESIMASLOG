<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Corporativo - Simas Logística</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --blue-main: #0B1D32;
            --blue-dark: #020122;
            --red-main: #A30D00;
            --red-light: #AB2317;
            --wine: #4F000B;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--blue-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(11, 29, 50, 0.8) 0%, transparent 70%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-attachment: fixed;
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            width: 100%;
        }

        .logo {
            height: 140px;
            max-width: 100%;
            object-fit: contain;
            margin-bottom: 24px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            font-weight: 400;
            letter-spacing: 0.01em;
            text-transform: uppercase;
        }

        .dashboard-panel {
            background: rgba(11, 29, 50, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .date-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .date-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-input-wrapper {
            position: relative;
            background: rgba(2, 1, 34, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 4px;
            transition: all 0.2s ease;
        }

        .date-input-wrapper:focus-within {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 3px rgba(163, 13, 0, 0.2);
            background: rgba(2, 1, 34, 0.8);
        }

        .date-input {
            background: transparent;
            border: none;
            color: var(--white);
            font-size: 1.1rem;
            padding: 12px 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            color-scheme: dark;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(11, 29, 50, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 24px;
            text-align: left;
            text-decoration: none;
            color: var(--white);
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, var(--red-light) 0%, var(--red-main) 100%);
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 0;
        }

        .card > * {
            position: relative;
            z-index: 1;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(163, 13, 0, 0.3), 0 10px 10px -5px rgba(163, 13, 0, 0.2);
            border-color: transparent;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-icon {
            font-size: 1.8rem;
            color: #94a3b8;
            margin-bottom: 16px;
            transition: color 0.2s ease;
        }

        .card:hover .card-icon {
            color: var(--white);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
        }

        #logo-fallback {
            display: none;
            font-size: 2rem;
            font-weight: 800;
            color: var(--white);
            letter-spacing: 2px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

    <div class="container fade-in">
        <header>
            <img src="logo.png" alt="Simas Logística" class="logo" id="simasLogo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
            <div id="logo-fallback">SIMAS LOGÍSTICA</div>
            
            <h1>ONEPAGE REPORT</h1>
            <p class="subtitle">Controle Corporativo de Indicadores e Ocorrências</p>
        </header>

        <div class="dashboard-panel">
            <div class="date-container">
                <label class="date-label" for="reportDate">
                    <i class="fa-regular fa-calendar-alt"></i> Data do Relatório
                </label>
                <div class="date-input-wrapper">
                    <input type="date" id="reportDate" class="date-input">
                </div>
            </div>

            <div class="grid">
                <div class="card" onclick="openReport('Matriz')">
                    <i class="fas fa-building card-icon"></i>
                    <div class="card-title">MATRIZ</div>
                </div>
                <div class="card" onclick="openReport('Funeas')">
                    <i class="fas fa-hospital-user card-icon"></i>
                    <div class="card-title">FUNEAS</div>
                </div>
                <div class="card" onclick="openReport('São Roque')">
                    <i class="fas fa-map-location-dot card-icon"></i>
                    <div class="card-title">SÃO ROQUE</div>
                </div>
                <div class="card" onclick="openReport('Sorocaba')">
                    <i class="fas fa-warehouse card-icon"></i>
                    <div class="card-title">SOROCABA</div>
                </div>
                <div class="card" onclick="openReport('Prefeitura SJP')">
                    <i class="fas fa-city card-icon"></i>
                    <div class="card-title">PREFEITURA SJP</div>
                </div>
                <div class="card" onclick="openReport('Camaçari')">
                    <i class="fas fa-industry card-icon"></i>
                    <div class="card-title">CAMAÇARI</div>
                </div>
                <div class="card" onclick="openReport('Patrimônio')">
                    <i class="fas fa-shield-halved card-icon"></i>
                    <div class="card-title">PATRIMÔNIO</div>
                </div>
            </div>
        </div>

        <div style="margin-top: 40px; display: flex; gap: 10px; justify-content: center; width: 100%;">
            <button onclick="exportData()" style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: all 0.2s;">
                <i class="fas fa-download"></i> Exportar Dados (Backup)
            </button>
            <label style="background: rgba(22, 163, 74, 0.2); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 500; display: flex; align-items: center; gap: 8px; transition: all 0.2s;">
                <i class="fas fa-upload"></i> Importar Backup
                <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
            </label>
        </div>

        <div class="footer">
            &copy; 2026 Simas Logística. Todos os direitos reservados.
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('reportDate').value = today;

            fetch('logo.b64')
                .then(res => {
                    if(res.ok) return res.text();
                    throw new Error('No b64');
                })
                .then(b64 => {
                    if(b64 && b64.trim().length > 100) {
                        document.getElementById('simasLogo').src = b64.trim();
                    }
                })
                .catch(e => {
                });
        });

        function openReport(filial) {
            const selectedDate = document.getElementById('reportDate').value;
            const targetUrl = `report.html?op=${encodeURIComponent(filial)}&date=${selectedDate}`;
            
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.2s ease';
            
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 200);
        }

        function exportData() {
            const data = localStorage.getItem('simas_report_data');
            if (!data) {
                alert('Nenhum dado encontrado para exportar.');
                return;
            }
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `simas_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    JSON.parse(content); // Valida se é JSON
                    localStorage.setItem('simas_report_data', content);
                    alert('Dados importados com sucesso! O sistema foi restaurado.');
                    window.location.reload();
                } catch(err) {
                    alert('Erro ao importar arquivo. Certifique-se de que é o arquivo de backup correto.');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
