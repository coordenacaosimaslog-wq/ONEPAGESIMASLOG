<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management One Page Report - Simas Logística</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #0f172a;
            --accent: #3b82f6;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.05) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 0 5%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .hero-section {
            margin-bottom: 3.5rem;
        }

        .main-logo {
            width: 180px;
            margin-bottom: 1.5rem;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        .controls-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 500px;
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.6);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .selection-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .selector-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.6rem;
            text-align: left;
            position: relative;
        }

        .label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            padding-left: 4px;
        }

        .discrete-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 0.9rem 1.2rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .discrete-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        #filialMenu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 100%;
            background: #1e293b;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
            z-index: 100;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .menu-item {
            padding: 0.8rem 1.2rem;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background: var(--accent);
        }

        .date-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            color-scheme: dark;
        }

        .btn-submit {
            width: 100%;
            background: var(--white);
            color: var(--primary);
            border: none;
            padding: 1.1rem;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            margin-top: 1rem;
        }

        .btn-submit:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            background: #f8fafc;
        }

        .footer {
            position: absolute;
            bottom: 2.5rem;
            width: 100%;
            padding: 0 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0.5;
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .footer-logo img {
            height: 30px;
            filter: grayscale(1) invert(1);
        }
    </style>
</head>

<body>

    <div class="bg-glow"></div>

    <div class="container">
        <div class="hero-section">
            <img src="logo.png" alt="Simas Logística" class="main-logo">
            <h1 class="hero-title">Management <br> One Page Report</h1>
            <div class="hero-subtitle">Simas Group &bull; Corporate Portal</div>
        </div>

        <div class="controls-card">
            <div class="selection-group">
                <div class="selector-box">
                    <span class="label">Operação</span>
                    <button class="discrete-btn" id="branchTrigger" onclick="toggleMenu()">
                        <span id="selectedBranchLabel">Matriz</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div id="filialMenu">
                        <div class="menu-item" onclick="selectFilial('Matriz')">Matriz</div>
                        <div class="menu-item" onclick="selectFilial('Funeas')">Funeas</div>
                        <div class="menu-item" onclick="selectFilial('Sorocaba')">Sorocaba</div>
                        <div class="menu-item" onclick="selectFilial('São Roque')">São Roque</div>
                        <div class="menu-item" onclick="selectFilial('Prefeitura SJP')">Prefeitura SJP</div>
                        <div class="menu-item" onclick="selectFilial('Camaçari')">Camaçari</div>
                        <div class="menu-item" onclick="selectFilial('Patrimônio')">Patrimônio</div>
                    </div>
                </div>

                <div class="selector-box">
                    <span class="label">Data de Referência</span>
                    <input type="date" id="dateSelect" class="date-input">
                </div>
            </div>

            <button class="btn-submit" onclick="accessReport()">
                Acessar Dashboard
            </button>
        </div>
    </div>

    <div class="footer">
        <div>© 2026 SIMAS GROUP | GOVERNANÇA CORPORATIVA</div>
        <div class="footer-logo"><img src="logo.png" alt="Logo"></div>
    </div>

    <script>
        let selectedFilial = 'Matriz';
        const now = new Date();
        document.getElementById('dateSelect').value = now.toISOString().split('T')[0];

        function toggleMenu() {
            const menu = document.getElementById('filialMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function selectFilial(name) {
            selectedFilial = name;
            document.getElementById('selectedBranchLabel').innerText = name;
            document.getElementById('filialMenu').style.display = 'none';
        }

        function accessReport() {
            const dateVal = document.getElementById('dateSelect').value;
            if (!dateVal) return alert('Selecione a data');
            window.location.href = `report.html?op=${encodeURIComponent(selectedFilial)}&date=${dateVal}`;
        }

        window.onclick = function (event) {
            if (!event.target.matches('#branchTrigger') && !event.target.closest('#branchTrigger')) {
                document.getElementById('filialMenu').style.display = "none";
            }
        }
    </script>

</body>

</html>
